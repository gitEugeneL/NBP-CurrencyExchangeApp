name: Frontend CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  react-native:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MobileClient

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: MobileClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Prettier check
        run: npx prettier . --check

      - name: Build
        run: npx expo export --platform android
        
  pwa-react:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: PWAClient
  
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 22
            cache: 'npm'
            cache-dependency-path: PWAClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Prettier check
        run: npx prettier . --check

      - name: Build
        run: npm run build